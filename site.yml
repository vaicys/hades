---
- hosts: all
  collections:
    - ansible.posix
  vars:
    media_root: /media/main

  vars_files:
    - vars/secrets.yml

  tasks:
    - import_tasks: tasks/common.yml
    - import_tasks: tasks/automatic-updates.yml
    - import_tasks: tasks/cockpit.yml
    - import_tasks: tasks/podman.yml
    - import_tasks: tasks/cloudflared.yml
    - import_tasks: tasks/tailscale.yml
    - import_tasks: tasks/home-assistant.yml
    - import_tasks: tasks/qbittorrent.yml
    - import_tasks: tasks/plex.yml
    - import_tasks: tasks/nfs.yml
    - import_tasks: tasks/firewall.yml
    - import_tasks: tasks/container-backup.yml
