---
- name: ensure qbittorrent is installed
  dnf:
    name: qbittorrent-nox
    state: latest

- name: add qbittorrent user to torrent-users
  user:
    name: qbittorrent
    groups: torrent-users
    append: yes

- name: write qbittorrent service file
  template:
    src: templates/qbittorrent.service.j2
    dest: /etc/systemd/system/qbittorrent.service

- name: reload systemctl daemon
  systemd_service:
    daemon_reload: yes

- name: stop qbittorrent
  service:
    name: qbittorrent
    state: stopped

- name: set correct owner and group
  file:
    path: "{{ media_root }}/qbittorrent"
    recurse: yes
    owner: qbittorrent
    group: qbittorrent
    mode: 02775
    state: directory

- name: create temp path
  file:
    path: "{{ media_root }}/Incoming/temp"
    group: torrent-users
    state: directory
    mode: 02775

- file:
    path: /home/qbittorrent/.config
    state: absent

- file:
    src: "{{ media_root }}/qbittorrent/.config"
    dest: /home/qbittorrent/.config
    group: qbittorrent
    state: link

- file:
    path: /home/qbittorrent/.local
    state: absent

- file:
    src: "{{ media_root }}/qbittorrent/.local"
    dest: /home/qbittorrent/.local
    group: qbittorrent
    state: link

- name: configure qbittorrent
  template:
    src: templates/qbittorrent.conf.j2
    dest:  "{{ media_root }}/qbittorrent/.config/qBittorrent/qBittorrent.conf"
  notify:
    - restart qbittorrent

- name: configure watched folders
  template:
    src: templates/watched_folders.json.j2
    dest: "{{ media_root }}/qbittorrent/.config/qBittorrent/watched_folders.json"
  notify:
    - restart qbittorrent

- name: ensure qbittorrent is running
  service:
    name: qbittorrent
    enabled: yes
    state: started
