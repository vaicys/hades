---
- name: create share paths
  file:
    path: "{{ media_root }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    state: directory
    mode: 02775
    recurse: yes
  loop: "{{ shares }}"
  loop_control:
    label: share

- name: create share paths
  file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    state: directory
    mode: 02775
    recurse: yes
  loop: "{{ shares }}"
  loop_control:
    label: share

- name: setup selinux context
  shell: semanage fcontext --add --type "samba_share_t" "{{ media_root }}(/.*)?" 

- name: restore selinux default security contexts
  shell: restorecon -R {{ media_root }}

