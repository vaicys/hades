---
- name: install nfs-utils
  dnf:
    name: nfs-utils
    state: present

- name: ensure nfs.conf.d directory exists
  file:
    path: /etc/nfs.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: enable manage-gids in nfs.conf.d so server resolves supplementary groups
  copy:
    dest: /etc/nfs.conf.d/manage-gids.conf
    content: |
      [mountd]
      manage-gids = y

      [exportd]
      manage-gids = y
    owner: root
    group: root
    mode: "0644"
  register: nfs_conf

- name: configure exports
  vars:
    nfs_export_options: rw,sync,no_subtree_check,no_root_squash
  lineinfile:
    path: /etc/exports
    line: "{{ media_root }} {{ network_subnet }}({{ nfs_export_options }})"
    regexp: "^{{ media_root | regex_escape() }}\\s+"
    state: present
    create: true
    mode: "0644"
  register: nfs_exports

- name: re-export shares
  command:
    cmd: exportfs -rav
  when: nfs_exports.changed

- name: ensure nfs-server is running
  service:
    name: nfs-server
    enabled: true
    state: "{{ 'restarted' if nfs_conf.changed else 'started' }}"
