---
- name: ensure podman, container-selinux, and cockpit-podman are installed
  dnf:
    name:
      - podman
      - container-selinux
      - cockpit-podman
    state: latest

- name: enable podman socket for cockpit-podman
  systemd:
    name: podman.socket
    state: started
    enabled: true
  when: not ansible_check_mode

- name: allow containers to use dri devices (Intel GPU) in selinux
  seboolean:
    name: container_use_dri_devices
    state: true
    persistent: true
  when: not ansible_check_mode

- name: ensure quadlet directory exists
  file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: enable podman-auto-update timer for seamless upstream updates
  systemd:
    name: podman-auto-update.timer
    state: started
    enabled: true
  when: not ansible_check_mode
