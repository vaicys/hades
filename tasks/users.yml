---
- name: ensure user accounts exist
  user:
    name: "{{ item.username }}"
    password: "{{ item.password | password_hash('sha512', 65534 | random(seed=item.username) | string) }}"
    groups: "{{ item.groups | default(omit) }}"
    shell: "{{ item.shell | default(omit) }}"
    append: true
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.username }}"
