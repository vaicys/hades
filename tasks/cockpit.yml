---
- name: ensure cockpit packages are installed
  dnf:
    name:
      - cockpit
      - cockpit-networkmanager
      - cockpit-packagekit
      - cockpit-selinux
      - cockpit-storaged
    state: latest

- name: ensure cockpit socket is enabled and running
  systemd:
    name: cockpit.socket
    state: started
    enabled: true
