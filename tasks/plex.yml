---
- name: ensure plex group exists
  group:
    name: plex
    state: present

- name: ensure plex user exists
  user:
    name: plex
    group: plex
    groups:
      - torrent-users
      - video
      - render
    append: true
    shell: /usr/sbin/nologin
    create_home: false
  register: plex_user

- name: look up group table for supplementary group gids
  getent:
    database: group

- name: deploy plex-config quadlet volume unit
  template:
    src: templates/plex-config.volume.j2
    dest: /etc/containers/systemd/plex-config.volume
    owner: root
    group: root
    mode: "0644"
  register: plex_volume_quadlet

- name: deploy plex quadlet container unit
  template:
    src: templates/plex.container.j2
    dest: /etc/containers/systemd/plex.container
    owner: root
    group: root
    mode: "0644"
  register: plex_quadlet

- name: reload systemd daemon to generate quadlet units
  systemd:
    daemon_reload: true
  when: plex_volume_quadlet.changed or plex_quadlet.changed

- name: ensure plex container service is started
  systemd:
    name: plex.service
    state: "{{ 'restarted' if (plex_volume_quadlet.changed or plex_quadlet.changed) else 'started' }}"
  when: not ansible_check_mode
